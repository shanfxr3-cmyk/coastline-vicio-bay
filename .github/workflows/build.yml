name: "Build & Validate (Coastline: Vicio Bay)"

on:
  push:
    branches: [ main, dev ]
  pull_request:
    branches: [ main, dev ]
  workflow_dispatch:

env:
  GODOT_VER: "4.7.2-stable"
  GODOT_DIR_VER: "4.7.2.stable"

jobs:
  validate:
    name: Validate & Screenshot (Lavapipe)
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Install headless Vulkan / Xvfb / tooling
        run: |
          sudo apt-get update -qq
          sudo DEBIAN_FRONTEND=noninteractive apt-get install -y --no-install-recommends \
            mesa-vulkan-drivers vulkan-tools xvfb \
            libfontconfig1 libx11-6 libxcursor1 libxinerama1 libxrandr2 libxi6 libgl1 libasound2t64 \
            unzip wget curl ca-certificates
          python3 -m pip install --quiet numpy Pillow trimesh

      - name: Cache Godot ${{ env.GODOT_VER }}
        id: cache-godot
        uses: actions/cache@v4
        with:
          path: ~/opt/godot
          key: godot-linux-${{ env.GODOT_VER }}

      - name: Install Godot ${{ env.GODOT_VER }}
        if: steps.cache-godot.outputs.cache-hit != 'true'
        run: |
          TMP_DIR="$(mktemp -d)"
          mkdir -p "$HOME/opt/godot"
          wget -q -O "$TMP_DIR/godot.zip" "https://github.com/godotengine/godot/releases/download/${GODOT_VER}/Godot_v${GODOT_VER}_linux.x86_64.zip"
          unzip -oq "$TMP_DIR/godot.zip" -d "$TMP_DIR"
          mv "$TMP_DIR/Godot_v${GODOT_VER}_linux.x86_64" "$HOME/opt/godot/godot"
          chmod +x "$HOME/opt/godot/godot"
          rm -rf "$TMP_DIR"

      - name: Link Godot binary
        run: sudo ln -sf "$HOME/opt/godot/godot" /usr/local/bin/godot

      - name: Cache Godot imported resources
        uses: actions/cache@v4
        with:
          path: .godot
          key: godot-imported-${{ env.GODOT_VER }}-${{ hashFiles('project.godot', 'shaders/**', 'assets/manifest.json') }}

      - name: Run tools/validate.sh
        run: bash tools/validate.sh

      - name: Render Phase 2 LOW screenshot (Standard / Mobile)
        run: bash tools/screenshot.sh mobile tests/screenshots/phase2_low.png 1280x720 30 low

      - name: Render Phase 2 HIGH screenshot (Standard / Mobile)
        run: bash tools/screenshot.sh mobile tests/screenshots/phase2_high.png 1280x720 30 high

      - name: Render Phase 2 HIGH screenshot (Ultra / Forward+)
        run: bash tools/screenshot.sh forward_plus tests/screenshots/phase2_ultra.png 1280x720 30 high

      - name: Upload validation screenshots
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: phase2-screenshots
          path: tests/screenshots/phase2_*.png

  build-android:
    name: Build Android (STANDARD, ULTRA, AAB)
    needs: validate
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Install Android SDK components (API 36, Build-Tools 36.1.0, NDK 29)
        run: |
          SDK_ROOT="${ANDROID_HOME:-/usr/local/lib/android/sdk}"
          if [ ! -x "$SDK_ROOT/cmdline-tools/latest/bin/sdkmanager" ]; then
            mkdir -p "$SDK_ROOT/cmdline-tools"
            TMP_DIR="$(mktemp -d)"
            wget -q -O "$TMP_DIR/cmdline-tools.zip" "https://dl.google.com/android/repository/commandlinetools-linux-11076708_latest.zip"
            unzip -oq "$TMP_DIR/cmdline-tools.zip" -d "$TMP_DIR/unpack"
            mv "$TMP_DIR/unpack/cmdline-tools" "$SDK_ROOT/cmdline-tools/latest"
            rm -rf "$TMP_DIR"
          fi
          echo "ANDROID_HOME=$SDK_ROOT" >> "$GITHUB_ENV"
          echo "ANDROID_SDK_ROOT=$SDK_ROOT" >> "$GITHUB_ENV"
          export PATH="$SDK_ROOT/cmdline-tools/latest/bin:$SDK_ROOT/platform-tools:$PATH"
          yes | sdkmanager --licenses >/dev/null 2>&1 || true
          sdkmanager "platform-tools" "platforms;android-36" "build-tools;36.1.0" "ndk;29.0.14206865"

      - name: Install runtime deps for Godot headless
        run: |
          sudo apt-get update -qq
          sudo DEBIAN_FRONTEND=noninteractive apt-get install -y --no-install-recommends \
            libfontconfig1 libx11-6 libxcursor1 libxinerama1 libxrandr2 libxi6 libgl1 unzip wget curl

      - name: Cache Godot ${{ env.GODOT_VER }}
        id: cache-godot
        uses: actions/cache@v4
        with:
          path: ~/opt/godot
          key: godot-linux-${{ env.GODOT_VER }}

      - name: Install Godot ${{ env.GODOT_VER }} (fallback)
        if: steps.cache-godot.outputs.cache-hit != 'true'
        run: |
          TMP_DIR="$(mktemp -d)"
          mkdir -p "$HOME/opt/godot"
          wget -q -O "$TMP_DIR/godot.zip" "https://github.com/godotengine/godot/releases/download/${GODOT_VER}/Godot_v${GODOT_VER}_linux.x86_64.zip"
          unzip -oq "$TMP_DIR/godot.zip" -d "$TMP_DIR"
          mv "$TMP_DIR/Godot_v${GODOT_VER}_linux.x86_64" "$HOME/opt/godot/godot"
          chmod +x "$HOME/opt/godot/godot"
          rm -rf "$TMP_DIR"

      - name: Link Godot binary
        run: sudo ln -sf "$HOME/opt/godot/godot" /usr/local/bin/godot

      - name: Cache Godot export templates ${{ env.GODOT_VER }}
        id: cache-templates
        uses: actions/cache@v4
        with:
          path: ~/.local/share/godot/export_templates
          key: godot-templates-${{ env.GODOT_VER }}

      - name: Install Godot export templates
        if: steps.cache-templates.outputs.cache-hit != 'true'
        run: |
          TMP_DIR="$(mktemp -d)"
          mkdir -p "$HOME/.local/share/godot/export_templates/${GODOT_DIR_VER}"
          wget -q -O "$TMP_DIR/templates.tpz" "https://github.com/godotengine/godot/releases/download/${GODOT_VER}/Godot_v${GODOT_VER}_export_templates.tpz"
          unzip -oq "$TMP_DIR/templates.tpz" -d "$TMP_DIR/unpack"
          mv "$TMP_DIR/unpack/templates/"* "$HOME/.local/share/godot/export_templates/${GODOT_DIR_VER}/"
          rm -rf "$TMP_DIR"

      - name: Cache Gradle & imported resources
        uses: actions/cache@v4
        with:
          path: |
            ~/.gradle/caches
            ~/.gradle/wrapper
            .godot
          key: android-gradle-${{ env.GODOT_VER }}-${{ hashFiles('export_presets.cfg', 'project.godot') }}
          restore-keys: |
            android-gradle-${{ env.GODOT_VER }}-

      - name: Decode release keystore if secrets are configured
        id: keystore
        env:
          KEYSTORE_B64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
          KEYSTORE_ALIAS: ${{ secrets.ANDROID_KEYSTORE_ALIAS }}
          KEYSTORE_PASS: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
        run: |
          if [ -n "$KEYSTORE_B64" ] && [ -n "$KEYSTORE_ALIAS" ] && [ -n "$KEYSTORE_PASS" ]; then
            echo "$KEYSTORE_B64" | base64 -d > "$RUNNER_TEMP/release.keystore"
            echo "RELEASE_KEYSTORE_PATH=$RUNNER_TEMP/release.keystore" >> "$GITHUB_ENV"
            echo "RELEASE_KEYSTORE_ALIAS=$KEYSTORE_ALIAS" >> "$GITHUB_ENV"
            echo "RELEASE_KEYSTORE_PASSWORD=$KEYSTORE_PASS" >> "$GITHUB_ENV"
            echo "Release keystore decoded."
          else
            echo "Release keystore secrets not set; using debug signing."
          fi

      - name: Build STANDARD APK (Mobile renderer)
        run: bash tools/build_android.sh standard apk build/coastline-vicio-bay-standard.apk

      - name: Build ULTRA APK (Forward+ renderer)
        run: bash tools/build_android.sh ultra apk build/coastline-vicio-bay-ultra.apk

      - name: Build Android App Bundle (AAB)
        run: bash tools/build_android.sh standard aab build/coastline-vicio-bay.aab

      - name: Upload STANDARD APK
        uses: actions/upload-artifact@v4
        with:
          name: coastline-standard-apk
          path: build/coastline-vicio-bay-standard.apk

      - name: Upload ULTRA APK
        uses: actions/upload-artifact@v4
        with:
          name: coastline-ultra-apk
          path: build/coastline-vicio-bay-ultra.apk

      - name: Upload Android App Bundle (AAB)
        uses: actions/upload-artifact@v4
        with:
          name: coastline-aab
          path: build/coastline-vicio-bay.aab
